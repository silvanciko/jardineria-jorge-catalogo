<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel privado — Jardinería Jorge</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<main class="login-screen">
  <div class="login-card">
    <form id="loginForm" novalidate>
      <div class="logo-badge" style="margin:0 auto 18px;">
        <img src="../assets/images/logo.png" alt="Jardinería Jorge" width="56" height="56">
      </div>
      <h1>Panel privado</h1>
      <p>Acceso exclusivo para la administración del catálogo.</p>

      <div class="login-error" id="loginError" role="alert">Contraseña incorrecta. Intenta de nuevo.</div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="login-submit" id="loginSubmit">Ingresar</button>
    </form>
  </div>
</main>

<script src="admin.js" defer></script>
</body>
</html>
